<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>種智院大学 実習評価システム</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f8f9fa; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; }
        
        /* フォントサイズを大きく設定 */
        body { font-size: 18px; line-height: 1.6; color: #333; }

        .screen { display: none; width: 100%; }
        #loginScreen.active { display: flex; height: 100vh; align-items: center; justify-content: center; background-color: #e9ecef; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 420px; }
        
        #mainApp.active { display: block; }
        .app-container { max-width: 900px; margin: 0 auto; padding: 25px 15px; }
        .card { background: white; padding: 30px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* 注意事項と評価基準表 */
        .notice-box { background-color: #fff9db; border: 1px solid #ffec99; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .notice-box h3 { margin-top: 0; font-size: 1.2rem; color: #e67700; border-bottom: 2px solid #ffec99; padding-bottom: 8px; }
        .rating-table { width: 100%; border-collapse: collapse; margin: 15px 0; background: white; font-size: 16px; }
        .rating-table th, .rating-table td { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        .rating-table th { background-color: #f1f3f5; }

        /* フォーム要素 */
        .form-control { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ced4da; border-radius: 6px; margin-top: 6px; }
        h2 { font-size: 1.3rem; color: #0056b3; border-left: 8px solid #0056b3; padding-left: 15px; margin: 0 0 20px 0; }
        .eval-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #f1f3f5; }
        .radio-group { display: flex; gap: 15px; }
        
        .btn { padding: 16px 28px; cursor: pointer; border-radius: 6px; font-weight: bold; border: none; font-size: 18px; transition: 0.2s; }
        .btn--primary { background: #007bff; color: white; width: 100%; }
        .btn--save { background: #28a745; color: white; width: 100%; font-size: 1.4rem; padding: 25px; margin-top: 20px; }
        .btn--logout { background: #6c757d; color: white; padding: 10px 20px; font-size: 16px; }
        
        label { font-size: 17px; font-weight: bold; color: #495057; }
        .score-label { font-size: 15px; text-align: center; cursor: pointer; padding: 5px; border-radius: 4px; border: 1px solid transparent; }
        .score-label:hover { background-color: #f1f3f5; }
        
        .textarea-view { min-height: 120px; margin-top: 10px; }
        .textarea-total { min-height: 250px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="screen active">
        <div class="login-card">
            <h2 style="text-align:center; border:none; padding:0; color:#333; margin-bottom:30px;">種智院大学<br>実習評価システム</h2>
            <form id="loginForm">
                <div style="margin-bottom:20px;"><label>学籍番号</label><input type="text" id="studentId" class="form-control" required></div>
                <div style="margin-bottom:30px;"><label>パスワード</label><input type="password" id="password" class="form-control" required></div>
                <button type="submit" class="btn btn--primary" id="loginBtn">ログイン</button>
                <div id="loginError" style="color: #dc3545; text-align:center; font-size:16px; margin-top:15px; min-height:1.2em;"></div>
            </form>
        </div>
    </div>

    <div id="mainApp" class="screen">
        <div class="app-container">
            <header style="display:flex; justify-content: space-between; align-items: center; background:white; padding:20px; border-radius:8px; margin-bottom:25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <div>学籍番号: <span id="displayId" style="margin-right:20px;"></span> 氏名: <strong><span id="currentUserName"></span></strong></div>
                <button onclick="location.reload()" class="btn btn--logout">ログアウト</button>
            </header>

            <form id="evaluationForm">
                <section class="card">
                    <h2>実習施設情報</h2>
                    <div style="margin-bottom:15px;"><label>施設・機関名</label><input type="text" id="info_facility" class="form-control"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                        <div><label>実習指導者</label><input type="text" id="info_mentor" class="form-control"></div>
                        <div>
                            <label>形態</label>
                            <div style="margin-top:10px;">
                                <input type="radio" name="stay_type" value="通い" id="stay_1"> <label for="stay_1" style="font-weight:normal; margin-right:15px;">通い</label>
                                <input type="radio" name="stay_type" value="宿泊" id="stay_2"> <label for="stay_2" style="font-weight:normal;">宿泊</label>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="notice-box">
                    <h3>【記入上の注意・評価基準】</h3>
                    <p style="font-size: 16px; margin-bottom: 10px;">到達状況を以下の5段階（5〜1）、または非該当で評価してください。</p>
                    
                    <table class="rating-table">
                        <tr><th>評価</th><th>内容の目安</th></tr>
                        <tr><td>5</td><td>大変よい</td></tr>
                        <tr><td>4</td><td>よい</td></tr>
                        <tr><td>3</td><td>ふつう</td></tr>
                        <tr><td>2</td><td>努力を要する</td></tr>
                        <tr><td>1</td><td>かなり努力を要する</td></tr>
                        <tr><td>非該当</td><td>実習内容に含まれない</td></tr>
                    </table>

                    <ul style="font-size: 16px; padding-left: 20px;">
                        <li>【所見】欄には、評価の根拠を具体的にご記入ください。</li>
                        <li>「データを保存・更新する」ボタンを押すまで、入力内容は反映されません。</li>
                    </ul>
                </div>

                <div id="dynamicSections"></div>

                <section class="card">
                    <h2>Ｅ　総合評価</h2>
                    <div class="radio-group" id="group-E" style="justify-content: space-around; padding: 10px 0;"></div>
                </section>

                <section class="card">
                    <h2>総評・アドバイス</h2>
                    <div style="margin-bottom:25px;">
                        <label>Ｆ．実習生に関する総評</label>
                        <textarea id="comment-F" class="form-control textarea-total" placeholder="実習生の全体的な印象や成長についてご記入ください"></textarea>
                    </div>
                    <div>
                        <label>Ｇ．今後の学習へのアドバイス</label>
                        <textarea id="comment-G" class="form-control textarea-total" placeholder="長所・短所・今後の学習事項についてご記入ください"></textarea>
                    </div>
                </section>

                <button type="submit" class="btn btn--save" id="saveBtn">データを保存・更新する</button>
            </form>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzBuU4I8fuECSldym_-c2KDY8gVFGCwAIyjZdMqWr5nH88u9xiqgBbU71ylaA56GQyy8A/exec";
        
        const evalConfig = {
            'Ａ．基本的知識の理解・習得': {
                prefix: 'A',
                items: [
                    '① 利用者及び生活課題・ニーズに関する理解',
                    '② 実習した職種の業務内容に関する理解',
                    '③ 実習施設の機構・機能に対する理解',
                    '④ 関連する他施設・制度・資源に関する理解'
                ]
            },
            'Ｂ．基本的技術・技能の習得': {
                prefix: 'B',
                items: [
                    '① 利用者に対して共感的に接する技能',
                    '② 基本的技術（面接、観察等）の習得',
                    '③ 実習日誌や各種記録の作成能力'
                ]
            },
            'Ｃ．実習態度の状況': {
                prefix: 'C',
                items: [
                    '① 規則の遵守（マナー、言葉遣い等）',
                    '② 職務を習得しようとする意欲・積極性',
                    '③ 利用者に積極的に関わろうとする態度',
                    '④ 利用者の人権・人格を尊重する態度',
                    '⑤ 指導・助言を積極的に求める態度',
                    '⑥ 他職種・他職員と協働しようとする態度'
                ]
            },
            'Ｄ．実習を通した変容': {
                prefix: 'D',
                items: [
                    '① 各自の実習目標の達成度',
                    '② 利用者・ニーズへの理解の深まり',
                    '③ 実践現場に関する理解の深まり',
                    '④ 実践技術・技能の深まり',
                    '⑤ 自己理解の深まり'
                ]
            }
        };

        function makeRadios(name) {
            return [5, 4, 3, 2, 1, '非該当'].map(v => `
                <label class="score-label">
                    <input type="radio" name="${name}" value="${v}">
                    <br>${v}
                </label>
            `).join('');
        }

        function initForm() {
            let html = '';
            for (let title in evalConfig) {
                const conf = evalConfig[title];
                html += `<section class="card"><h2>${title}</h2>`;
                conf.items.forEach((text, i) => {
                    html += `<div class="eval-row">
                        <div style="font-size:17px; flex:1; padding-right:15px; color:#333;">${text}</div>
                        <div class="radio-group">${makeRadios(conf.prefix + (i+1))}</div>
                    </div>`;
                });
                html += `<p style="margin-top:20px; font-weight:bold; font-size:16px; color:#495057;">【${conf.prefix}項目の所見】</p>
                         <textarea id="view-${conf.prefix}" class="form-control textarea-view" placeholder="評価の具体的な理由をご記入ください"></textarea></section>`;
            }
            document.getElementById('dynamicSections').innerHTML = html;
            document.getElementById('group-E').innerHTML = makeRadios('E');
        }

        // ログイン処理
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            btn.disabled = true; btn.innerText = "認証中...";
            try {
                const res = await postToGAS({
                    action: "login",
                    studentId: document.getElementById('studentId').value,
                    password: document.getElementById('password').value
                });
                if (res.success) {
                    document.getElementById('displayId').innerText = res.id;
                    document.getElementById('currentUserName').innerText = res.userName;
                    if (res.savedData) fillForm(res.savedData);
                    document.getElementById('loginScreen').classList.remove('active');
                    document.getElementById('mainApp').classList.add('active');
                    window.scrollTo(0,0);
                } else { err.innerText = "IDまたはパスワードが正しくありません"; }
            } catch(e) { err.innerText = "通信エラーが発生しました"; }
            btn.disabled = false; btn.innerText = "ログイン";
        });

        // フォーム保存
        document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "保存中...";
            
            const formData = [
                document.getElementById('displayId').innerText,
                document.getElementById('currentUserName').innerText,
                "ソーシャルワーク実習",
                "", "", document.getElementById('info_facility').value, 
                "", "", document.getElementById('info_mentor').value,
                "", "", (document.querySelector('input[name="stay_type"]:checked') || {}).value || "",
                "", "", "", "", "", ""
            ];

            ['A', 'B', 'C', 'D'].forEach(p => {
                const count = (p==='A')?4 : (p==='B')?3 : (p==='C')?6 : 5;
                for(let i=1; i<=count; i++) {
                    formData.push((document.querySelector(`input[name="${p}${i}"]:checked`) || {}).value || "");
                }
                formData.push(document.getElementById(`view-${p}`).value);
            });
            formData.push((document.querySelector('input[name="E"]:checked') || {}).value || "");
            formData.push(document.getElementById('comment-F').value);
            formData.push(document.getElementById('comment-G').value);

            try {
                await postToGAS({ action: "save", formData });
                alert("データの保存・更新が完了しました。");
            } catch(e) { alert("保存エラーが発生しました。"); }
            btn.disabled = false; btn.innerText = "データを保存・更新する";
        });

        async function postToGAS(payload) {
            const response = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
            return await response.json();
        }

        function fillForm(d) {
            const setVal = (id, val) => { if(document.getElementById(id)) document.getElementById(id).value = val || ""; };
            setVal('info_facility', d[5]);
            setVal('info_mentor', d[8]);
            if(d[11]) { const r = document.querySelector(`input[name="stay_type"][value="${d[11]}"]`); if(r) r.checked = true; }
            let col = 18;
            ['A', 'B', 'C', 'D'].forEach(p => {
                const count = (p==='A')?4 : (p==='B')?3 : (p==='C')?6 : 5;
                for(let i=1; i<=count; i++) {
                    const r = document.querySelector(`input[name="${p}${i}"][value="${d[col++]}"]`);
                    if(r) r.checked = true;
                }
                setVal(`view-${p}`, d[col++]);
            });
            const rE = document.querySelector(`input[name="E"][value="${d[col++]}"]`);
            if(rE) rE.checked = true;
            setVal('comment-F', d[col++]); setVal('comment-G', d[col++]);
        }

        initForm();
    </script>
</body>
</html>
